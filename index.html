<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NH Cargo Rendszer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#b8963e; --accent-ink:#1a1609; --accent-soft:rgba(184,150,62,.14);
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#faf9f5; --text:#1c1e22; --muted:#6a6e77; --border:#e5e2d8;
  --sb-bg:#14171c; --sb-text:#cfc9b6; --sb-muted:#8a8676; --sb-hover:rgba(203,178,106,.10); --sb-border:#262a31;
  --ok:#2f7d5b; --ok-soft:rgba(47,125,91,.12); --warn:#b7791f; --warn-soft:rgba(183,121,31,.14);
  --bad:#c0392b; --bad-soft:rgba(192,57,43,.12); --info:#2b6cb0; --info-soft:rgba(43,108,176,.12);
  --radius:10px; --pad:16px; --row:44px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#161920; --surface-2:#1b1f27; --text:#e8e6df; --muted:#9a9ca3; --border:#272b33;
    --accent-soft:rgba(203,178,106,.16); --shadow:none;
    --ok-soft:rgba(72,187,120,.16); --warn-soft:rgba(236,180,80,.16); --bad-soft:rgba(240,100,90,.16); --info-soft:rgba(99,160,230,.16);
    --ok:#5cc591; --warn:#e3b153; --bad:#ef7a6e; --info:#7fb2ec;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#161920; --surface-2:#1b1f27; --text:#e8e6df; --muted:#9a9ca3; --border:#272b33;
  --accent-soft:rgba(203,178,106,.16); --shadow:none;
  --ok-soft:rgba(72,187,120,.16); --warn-soft:rgba(236,180,80,.16); --bad-soft:rgba(240,100,90,.16); --info-soft:rgba(99,160,230,.16);
  --ok:#5cc591; --warn:#e3b153; --bad:#ef7a6e; --info:#7fb2ec;
}
:root[data-sidebar="light"]{ --sb-bg:var(--surface); --sb-text:var(--text); --sb-muted:var(--muted); --sb-hover:var(--accent-soft); --sb-border:var(--border); }
:root[data-density="compact"]{ --pad:12px; --row:36px; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* Sidebar */
.sb{background:var(--sb-bg);color:var(--sb-text);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid var(--sb-border)}
.sb-logo svg{width:100%;height:auto;display:block}
.sb-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-muted);margin-top:8px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--sb-text);font-weight:500}
.nav a:hover{background:var(--sb-hover)}
.nav a.on{background:var(--sb-hover);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.nav svg{width:18px;height:18px;flex:none}
.sb-foot{padding:14px 20px;border-top:1px solid var(--sb-border);font-size:12px;color:var(--sb-muted)}

/* Topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top .mlogo{display:none;width:34px;height:34px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--text)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}

/* Content */
.content{padding:24px;max-width:1400px;width:100%}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn svg{width:16px;height:16px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:2fr 1fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:14px var(--pad);border-bottom:1px solid var(--border)}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h .r{margin-left:auto}
.card-b{padding:var(--pad)}
.kpi{padding:var(--pad)}
.kpi .l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .l svg{width:16px;height:16px;color:var(--accent)}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px var(--pad);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:0 var(--pad);height:var(--row);border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px var(--pad);border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.li .ic svg{width:16px;height:16px}
.li .t{font-weight:600}
.li .d{color:var(--muted);font-size:13px}
.li .tm{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:16px;font-size:13px}
.notice svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}

/* AI review */
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.photo{aspect-ratio:4/3;max-height:360px;width:100%;border:2px dashed var(--border);border-radius:var(--radius);display:grid;place-items:center;color:var(--muted);text-align:center;background:var(--surface-2);padding:16px}
.photo svg{width:40px;height:40px;opacity:.6}
.photo.drop{cursor:pointer}.photo.drop:hover{border-color:var(--accent)}
.photo.has{border:1px solid var(--border);padding:0;overflow:hidden;background:#000;cursor:zoom-in;aspect-ratio:auto;height:360px;display:block}
.photo.has img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.ptools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ptools .muted{font-size:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:40;cursor:zoom-out;padding:16px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.fld:last-child{border-bottom:0}
.fld .k{color:var(--muted);font-size:13px}
.fld input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.conf{font-size:12px;font-weight:600}
.grp{margin-top:14px}
.grp h5{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
details.grp summary{cursor:pointer;color:var(--muted);font-size:13px;padding:8px 0;border-top:1px solid var(--border)}
.okline{font-size:12px;color:var(--ok);display:flex;gap:6px;align-items:center;padding:6px 0}
.okline svg{width:14px;height:14px;flex:none}
table.cmp td{height:36px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%}

/* Providers */
.prov{grid-template-columns:repeat(3,minmax(0,1fr))}
.prov .card-b{display:flex;flex-direction:column;gap:8px}
.prov h4{margin:0;font-size:15px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}.open .drawer{transform:none}
.dr-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.dr-h h2{margin:0;font-size:18px}
.dr-b{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.sec h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.route{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--accent);margin-left:6px;padding-left:16px}
.route div{position:relative;padding:4px 0 12px}
.route div::before{content:"";position:absolute;left:-23px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}

/* Settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw-in{width:36px;height:32px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
pre.out{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:200px;margin:0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Mobile bottom nav */
.bnav{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.review,.set-grid{grid-template-columns:1fr}.prov{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sb{display:none}
  .top{padding:10px 16px}
  .top .mlogo{display:block}
  .top .pill,.top .hide-m{display:none}
  .content{padding:16px 16px 90px}
  .ph h1{font-size:19px}
  .ph .act{margin-left:0;width:100%}
  .kpi .v{font-size:24px}
  .fld{grid-template-columns:1fr;gap:4px}
  .kv{grid-template-columns:110px 1fr}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sb-bg);border-top:1px solid var(--sb-border);z-index:10;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sb-muted);text-decoration:none;padding:4px 0}
  .bnav a svg{width:20px;height:20px}
  .bnav a.on{color:var(--accent)}
}
</style>
</head>

const rotT = (r, el) => { if(!(r%180) || !el) return `rotate(${r}deg)`; const w=el.clientWidth||1, h=el.clientHeight||1; return `rotate(${r}deg) scale(${Math.min(w/h,h/w)})`; };

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLib=null;
async function loadPdfJs(){
  if(pdfLib) return pdfLib;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  pdfLib=window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  return pdfLib;
}
async function renderPdfPage(p){
  const page=await p.doc.getPage(p.page);
  const scale=Math.min(2.5,1600/page.getViewport({scale:1}).width), vp=page.getViewport({scale});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  p.img=c.toDataURL('image/jpeg',.9);
}
fileIn.addEventListener('change',async()=>{
  const f=fileIn.files[0]; fileIn.value=''; if(!f) return;

  if(!isPdf&&!f.type.startsWith('image/')) return toast('Csak kép vagy PDF tölthető fel.');
  const url=URL.createObjectURL(f);
  const next={url,img:url,name:f.name,no:upNo||(PHOTO&&PHOTO.no)||'MINTA-0008',rot:0,pdf:isPdf,page:1,pages:1};
  if(isPdf){
    toast('PDF betöltése…');
    try{
      const lib=await loadPdfJs();
      next.doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;
      next.pages=next.doc.numPages;
      await renderPdfPage(next);
    }catch(e){ URL.revokeObjectURL(url); return toast('A PDF nem nyitható meg.'); }
  }
  if(PHOTO) URL.revokeObjectURL(PHOTO.url);
  PHOTO=next; palTab='ai';
  if(location.hash!=='#pallets') location.hash='#pallets'; else route();
  toast((isPdf?'PDF':'Fotó')+' betöltve – AI-ellenőrzés (bemutató)');
});
async function gotoPage(d){
  const n=PHOTO.page+d; if(n<1||n>PHOTO.pages) return;
  PHOTO.page=n; await renderPdfPage(PHOTO); route();
}
function route(){
  const v=(location.hash||'#dash').slice(1); const view=V[v]?v:'dash';
  drawNav(view); closeOrder();
  document.getElementById('view').innerHTML = view==='pallets'?V.pallets(palTab):V[view]();
  drawCustom(); window.scrollTo(0,0);
  const pb=document.getElementById('photoBox'); if(pb) pb.querySelector('img').style.transform=rotT(PHOTO.rot,pb);
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
document.addEventListener('click',e=>{
  const t=e.target;
  const row=t.closest('[data-order]'); if(row) return openOrder(row.dataset.order);
  if(t.closest('#closeDr')||t.id==='scrim') return closeOrder();
  const up=t.closest('[data-upload]'); if(up){upNo=up.dataset.upload||null;return fileIn.click()}
  const bv=t.closest('[data-balv]'); if(bv){balView=bv.dataset.balv;return route()}
  if(t.closest('#pgPrev')) return gotoPage(-1);
  if(t.closest('#pgNext')) return gotoPage(1);
  if(t.closest('#rotBtn')){PHOTO.rot=(PHOTO.rot+90)%360;document.querySelector('#photoBox img').style.transform=rotT(PHOTO.rot,document.getElementById('photoBox'));return}
  if(t.closest('#zoomBtn')||t.closest('#photoBox')){const im=lb.querySelector('img');im.src=PHOTO.img;lb.classList.add('on');im.style.transform=rotT(PHOTO.rot,lb);return}
  if(t.closest('#lb')) return lb.classList.remove('on');
  const tab=t.closest('[data-tab]'); if(tab){palTab=tab.dataset.tab;return route()}
  const s=t.closest('[data-set]'); if(s){S[s.dataset.set]=s.dataset.val;apply();return drawCustom()}
  const a=t.closest('[data-acc]'); if(a){S.accent=a.dataset.acc;apply();return drawCustom()}
  if(t.closest('#resetC')){S={...DEF};apply();return drawCustom()}
  if(t.closest('[data-demo]')) toast('Prototípus: ez a funkció még nincs bekötve.');
});
document.addEventListener('input',e=>{
  if(e.target.id==='accIn'){S.accent=e.target.value;apply();document.querySelector('pre.out').textContent=JSON.stringify(S,null,2)}
  if(e.target.id==='subIn'){S.sub=e.target.value;apply();document.querySelector('pre.out').textContent=JSON.stringify(S,null,2)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOrder()});
window.addEventListener('hashchange',route);
apply(); route();
</script>
</body>
</html>
